spring.application.name=gym
server.port=8081

logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.security=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:15432/gym
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=5b8e3f7a2d9c4e6b1a0f8d3c7e2b5a9f4d6c8e1b3a7f0d2c5e8b4a6f9d1c3e7
jwt.expiration=3600000
jwt.refresh-expiration=2592000000

resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}

cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.account-id=${R2_ACCOUNT_ID}
cloudflare.r2.bucket=${R2_BUCKET}
cloudflare.r2.public-url=${R2_PUBLIC_URL}
